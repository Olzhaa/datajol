# Free Supabase projects pause after 7 days without activity. This makes one small
# read every 3 days so learners' sign-in and progress keep working.
name: Supabase keep-alive
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query the database once
        run: |
          URL=$(grep -o "https://[a-z0-9]*\.supabase\.co" js/config.js)
          KEY=$(grep -o "sb_publishable_[A-Za-z0-9_-]*" js/config.js)
          curl -fsS "$URL/rest/v1/rpc/cert_info" -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d '{"uid":"00000000-0000-0000-0000-000000000000"}'
