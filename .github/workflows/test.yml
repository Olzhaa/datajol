# Every pull request: the generated pages must match the sources, and every exercise's
# reference solution must pass in a real browser while its starter code must not; the first load stays under
# 200 KB gzip of JavaScript and the main screens have no serious accessibility issues.
name: Tests
on:
  pull_request:
  workflow_dispatch:
jobs:
  exercises:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generated files are up to date
        run: |
          python3 build.py
          git diff --stat --exit-code -- . ':!sitemap.xml' || { echo "::error::Run python3 build.py and commit the result."; exit 1; }
      - name: Install Playwright and Chromium
        run: npm i --no-save playwright@1.49.1 axe-core@4.10.2 && npx playwright install --with-deps chromium
      - name: Check every exercise
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          node tests/verify-exercises.js
      - name: Page weight budget and accessibility (axe)
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          node tests/ui-checks.js
