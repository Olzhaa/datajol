<style>
/* DataJol minimal: white space, one accent colour, thin lines, no decoration. */
[hidden] { display: none !important; }
:root {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --surface-2: #F6F7F7;
  --ink: #121616;
  --ink-2: #646B6A;
  --line: #E6E8E8;
  --line-strong: #D2D6D5;
  --accent: #0F766E;
  --accent-press: #0B5A54;
  --accent-ink: #FFFFFF;
  --accent-soft: #EAF5F3;
  --gold: #B45309;
  --gold-soft: #FDF6EC;
  --flame: #EA580C;
  --ok: #15803D;
  --ok-soft: #EEF8F1;
  --bad: #C2281D;
  --bad-soft: #FDF0EF;
  --code-bg: #111716;
  --code-ink: #E3EEEC;
  --code-key: #7DD3C8;
  --code-str: #F2D27A;
  --code-num: #F5AE7C;
  --code-com: #7D8C8A;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --radius: 12px;
  --t: 150ms ease;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1111; --surface: #0E1111; --surface-2: #171C1B; --ink: #ECEFEE; --ink-2: #9AA3A1;
    --line: #242B2A; --line-strong: #323B3A; --accent: #4FD1C1; --accent-press: #38B3A4; --accent-ink: #062320; --accent-soft: #14302C;
    --gold: #F5B451; --gold-soft: #2A2112; --flame: #FB923C;
    --ok: #5BD38A; --ok-soft: #12291B; --bad: #F58A80; --bad-soft: #2E1715; --code-bg: #080B0B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1111; --surface: #0E1111; --surface-2: #171C1B; --ink: #ECEFEE; --ink-2: #9AA3A1;
  --line: #242B2A; --line-strong: #323B3A; --accent: #4FD1C1; --accent-press: #38B3A4; --accent-ink: #062320; --accent-soft: #14302C;
  --gold: #F5B451; --gold-soft: #2A2112; --flame: #FB923C;
  --ok: #5BD38A; --ok-soft: #12291B; --bad: #F58A80; --bad-soft: #2E1715; --code-bg: #080B0B;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.65 var(--font-body); margin: 0; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
button { font: inherit; cursor: pointer; color: inherit; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-weight: 700; line-height: 1.25; text-wrap: balance; margin: 0; letter-spacing: -.015em; }
h1 { font-size: clamp(1.6rem, 3.6vw, 2.2rem); }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.02rem; }
code, pre, kbd { font-family: var(--font-mono); font-size: .87em; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 20px; min-height: 58px; flex-wrap: wrap; padding-block: 6px; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.05rem; color: var(--ink); border: 0; background: none; padding: 0; }
.logo-mark { width: 26px; height: 26px; }
.nav { display: flex; gap: 2px; flex-wrap: wrap; }
.nav button { background: none; border: 0; color: var(--ink-2); padding: 6px 10px; border-radius: 8px; font-weight: 500; transition: color var(--t), background var(--t); }
.nav button:hover { color: var(--ink); }
.nav button[aria-current="page"] { color: var(--ink); background: var(--surface-2); }
.stats { margin-left: auto; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; font-variant-numeric: tabular-nums; font-size: .9rem; white-space: nowrap; }
.pill svg { width: 16px; height: 16px; color: var(--ink-2); }
.pill.gold svg { color: var(--flame); }
.pill.xp svg { color: var(--gold); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-2); color: var(--ink); display: grid; place-items: center; font-weight: 600; border: 1px solid var(--line); font-size: .9rem; }

main { padding-block: 32px 80px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; padding: 10px 18px; font-weight: 600; border: 1px solid transparent; background: var(--accent); color: var(--accent-ink); transition: background var(--t), border-color var(--t); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn:hover { background: var(--accent-press); }
.btn.ghost { background: var(--bg); color: var(--ink); border-color: var(--line-strong); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.gold:hover { background: var(--accent-press); }
.btn:disabled { opacity: .5; }
.muted { color: var(--ink-2); }
.eyebrow { font-size: .82rem; font-weight: 500; color: var(--ink-2); }

/* auth */
.auth { display: grid; grid-template-columns: 1.1fr .9fr; gap: 56px; align-items: center; min-height: calc(100vh - 160px); }
.auth-hero h1 { font-size: clamp(2rem, 4.6vw, 3rem); }
.auth-hero h1 em { font-style: normal; color: var(--accent); }
.auth-hero p { font-size: 1.05rem; max-width: 48ch; color: var(--ink-2); }
.feature-chips { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 18px; }
.feature-chips span { display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; color: var(--ink-2); }
.feature-chips svg { width: 15px; height: 15px; color: var(--accent); }
.terminal { background: var(--code-bg); color: var(--code-ink); border-radius: var(--radius); padding: 16px 18px; font-family: var(--font-mono); font-size: .86rem; margin-top: 24px; overflow-x: auto; max-width: 540px; white-space: pre; }
.terminal .k { color: var(--code-key); } .terminal .s { color: var(--code-str); } .terminal .c { color: var(--code-key); }
.terminal table { border-collapse: collapse; margin-top: 4px; white-space: normal; }
.terminal td, .terminal th { padding: 2px 14px 2px 0; text-align: left; font-weight: 400; }
.terminal th { color: var(--code-com); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
.auth-card { display: grid; gap: 14px; padding: 28px; }
.tabs { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 10px; }
.tabs button { flex: 1; border: 0; background: none; padding: 7px; border-radius: 8px; font-weight: 500; color: var(--ink-2); }
.tabs button[aria-selected="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
label.field { display: grid; gap: 6px; font-weight: 500; font-size: .9rem; }
input[type="text"], input[type="password"], input[type="number"] { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--ink); width: 100%; transition: border-color var(--t); }
input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.err { color: var(--bad); font-size: .88rem; min-height: 1.2em; }
.note { font-size: .82rem; color: var(--ink-2); }

/* dashboard */
.hello { display: flex; gap: 16px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; margin-bottom: 24px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 24px; }
.kpi { padding: 14px 18px; display: grid; gap: 2px; align-content: start; min-width: 0; }
.kpi + .kpi { border-left: 1px solid var(--line); }
.kpi .v { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; }
.kpi .v svg { width: 18px; height: 18px; }
.kpi .v.flame svg { color: var(--flame); }
.kpi .v.xp svg { color: var(--gold); }
.kpi .l { font-size: .8rem; color: var(--ink-2); }
.kpi .bar { margin-top: 6px; }
.continue { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 16px; align-items: center; background: var(--surface-2); border-radius: var(--radius); padding: 22px 24px; }
.continue .eyebrow { color: var(--accent); }
.continue h2 { margin: 4px 0; }
.continue p { margin: 0; color: var(--ink-2); font-size: .92rem; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 40px 0 0; flex-wrap: wrap; }
.phase { margin-top: 26px; }
.phase-head { display: flex; gap: 10px; align-items: baseline; margin-bottom: 6px; flex-wrap: wrap; }
.phase-head h3 { font-size: 1rem; }
.phase-tag { font-size: .78rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.phase-head .muted { font-size: .88rem; }
.modules { display: grid; border-top: 1px solid var(--line); }
.module { display: grid; grid-template-columns: 52px minmax(0, 1fr) 130px 20px; gap: 14px; align-items: center; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 14px 6px; color: var(--ink); min-width: 0; transition: background var(--t); }
.module:hover:not(.soon) { background: var(--surface-2); }
.module.soon { cursor: default; }
.module .code { font-family: var(--font-mono); font-size: .8rem; color: var(--ink-2); }
.module h3 { font-size: .98rem; font-weight: 600; }
.module.soon h3 { font-weight: 500; color: var(--ink-2); }
.module p { margin: 2px 0 0; font-size: .86rem; color: var(--ink-2); }
.module .prog { display: grid; gap: 5px; }
.module .chev { color: var(--ink-2); display: flex; }
.module .chev svg { width: 16px; height: 16px; }
.badge-s { font-size: .78rem; font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.badge-s.done { color: var(--ok); }
.badge-s.open { color: var(--accent); }
.bar { height: 4px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.bar.gold > i { background: var(--gold); }

/* badges (profile) */
.bdg { display: grid; justify-items: center; gap: 6px; text-align: center; font-size: .72rem; color: var(--ink-2); }
.bdg .hex { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.bdg .hex svg { width: 20px; height: 20px; }
.bdg.got .hex { background: var(--gold-soft); color: var(--gold); border-color: color-mix(in srgb, var(--gold) 40%, transparent); }
.bdg.got { color: var(--ink); }

/* module page */
.crumbs { display: flex; gap: 8px; align-items: center; font-size: .88rem; color: var(--ink-2); margin-bottom: 18px; flex-wrap: wrap; }
.crumbs button { background: none; border: 0; color: var(--ink-2); padding: 0; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-strong); }
.crumbs button:hover { color: var(--ink); }
.lessons { display: grid; margin-top: 24px; border-top: 1px solid var(--line); }
.lesson-row { display: grid; grid-template-columns: 36px minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 13px 6px; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; color: var(--ink); transition: background var(--t); }
.lesson-row:hover { background: var(--surface-2); }
.lesson-row .num { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line-strong); font-size: .8rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.lesson-row.done .num { background: var(--ok); border-color: var(--ok); color: #fff; }
.lesson-row.gate .num { border-color: var(--gold); color: var(--gold); }
.lesson-row b { font-weight: 600; }
.lesson-row small { color: var(--ink-2); display: block; font-size: .82rem; }

/* lesson page */
.lesson { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 36px; align-items: start; }
.lesson.solo { grid-template-columns: minmax(0, 1fr); max-width: 720px; }
.lesson.solo .workbench { display: none; }
.reading { min-width: 0; }
.reading h1 { font-size: 1.7rem; margin: 6px 0 16px; }
.prose { max-width: 68ch; }
.prose p, .prose ul, .prose ol { margin: 0 0 14px; }
.prose li { margin-bottom: 4px; }
.prose h3 { margin: 28px 0 8px; }
.prose code { background: var(--surface-2); padding: 1px 5px; border-radius: 5px; word-break: break-word; }
.prose pre { background: var(--code-bg); color: var(--code-ink); padding: 13px 15px; border-radius: 10px; overflow-x: auto; margin: 0 0 16px; }
.prose pre code { background: none; padding: 0; }
.prose table { border-collapse: collapse; margin: 0 0 16px; font-size: .9rem; display: block; overflow-x: auto; }
.prose th, .prose td { border-bottom: 1px solid var(--line); padding: 7px 14px 7px 0; text-align: left; vertical-align: top; }
.prose th { font-weight: 600; font-size: .84rem; color: var(--ink-2); }
.prose .tip { border-left: 2px solid var(--accent); padding: 2px 0 2px 14px; margin: 0 0 16px; }
.task { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 22px; }
.task-steps { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.task-steps button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--bg); font-size: .8rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.task-steps button.cur { border-color: var(--ink); color: var(--ink); font-weight: 600; }
.task-steps button.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.task-steps button.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.gate-result.pass { border-color: var(--ok); }
.gate-result.fail { border-color: var(--bad); }
.task h3 { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.xp-tag { font-size: .78rem; font-weight: 600; color: var(--gold); }
.options { display: grid; gap: 8px; margin-top: 12px; }
.opt { text-align: left; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--ink); transition: border-color var(--t), background var(--t); }
.opt:hover { background: var(--surface-2); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt code { word-break: break-word; }
.opt pre { margin: 6px 0 0; background: var(--code-bg); color: var(--code-ink); padding: 8px 10px; border-radius: 8px; }
.hints { margin-top: 12px; display: grid; gap: 8px; }
.hint { border-left: 2px solid var(--gold); padding: 2px 0 2px 12px; font-size: .92rem; }
kbd { border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 4px; font-size: .78em; }
.workbench { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); display: grid; gap: 10px; min-width: 0; }
.editor-shell { background: var(--code-bg); border-radius: var(--radius); overflow: hidden; }
.editor-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 14px; color: var(--code-com); font-family: var(--font-mono); font-size: .76rem; border-bottom: 1px solid rgba(255,255,255,.06); flex-wrap: wrap; }
.editor-bar .lang { color: var(--code-ink); }
.editor-bar .dots { display: none; }
.CodeMirror { height: 260px; font-family: var(--font-mono); font-size: 14px; background: var(--code-bg); color: var(--code-ink); }
.CodeMirror-gutters { background: var(--code-bg); border-right: 0; }
.CodeMirror-linenumber { color: #4a5755; }
.CodeMirror-cursor { border-left-color: var(--code-key); }
div.CodeMirror-selected, .CodeMirror-focused div.CodeMirror-selected { background: #233a37; }
.cm-s-default .cm-keyword { color: var(--code-key); }
.cm-s-default .cm-string { color: var(--code-str); }
.cm-s-default .cm-number, .cm-s-default .cm-atom { color: var(--code-num); }
.cm-s-default .cm-bracket { color: var(--code-ink); }
.cm-s-default .cm-comment { color: var(--code-com); font-style: italic; }
.cm-s-default .cm-builtin { color: #A7E3CF; }
.cm-s-default .cm-def, .cm-s-default .cm-variable-2 { color: #EBD9A6; }
.cm-s-default .cm-operator { color: #A9BAB8; }
.cm-s-default .cm-variable, .cm-s-default .cm-property { color: var(--code-ink); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.output { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; min-height: 110px; max-height: 360px; overflow: auto; }
.output pre { margin: 0; font-family: var(--font-mono); font-size: .86rem; white-space: pre-wrap; word-break: break-word; }
.output table { border-collapse: collapse; font-size: .85rem; font-variant-numeric: tabular-nums; }
.output th, .output td { border-bottom: 1px solid var(--line); padding: 4px 14px 4px 0; text-align: left; white-space: nowrap; }
.output th { font-family: var(--font-mono); font-size: .76rem; color: var(--ink-2); font-weight: 500; }
.verdict { border-radius: 10px; padding: 10px 14px; font-weight: 500; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.bad { background: var(--bad-soft); color: var(--bad); }
.verdict.info { background: var(--surface-2); color: var(--ink-2); }
.lesson-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
.schema { font-size: .84rem; color: var(--ink-2); }
.schema summary { cursor: pointer; font-weight: 500; color: var(--ink); }
.schema code { color: var(--ink); }
.chart { width: 100%; max-width: 560px; height: auto; display: block; margin: 0 0 16px; }

/* map */
.map-phase { display: grid; grid-template-columns: 200px minmax(0,1fr); gap: 24px; padding: 24px 0; border-top: 1px solid var(--line); }
.map-phase .ph { font-size: .78rem; color: var(--ink-2); }
.map-phase h3 { margin: 2px 0 4px; }
.map-mods { display: grid; }
.map-mod { display: grid; grid-template-columns: 56px minmax(0,1fr) auto; gap: 12px; align-items: start; padding: 8px 0; }
.map-mod .c { font-family: var(--font-mono); font-size: .8rem; color: var(--ink-2); padding-top: 2px; }
.map-mod p { margin: 2px 0 0; font-size: .86rem; color: var(--ink-2); }
.paths { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 20px 0 12px; }
.path { border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.path h3 { margin-bottom: 6px; }
.path p { margin: 0; font-size: .88rem; color: var(--ink-2); }
.path .hrs { font-size: .82rem; color: var(--accent); margin-top: 10px; font-weight: 500; }

/* diag + toasts */
.diag { max-width: 680px; margin: 0 auto; display: grid; gap: 16px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 500; z-index: 50; display: flex; gap: 8px; align-items: center; max-width: calc(100vw - 32px); font-size: .92rem; }
.toast svg { width: 18px; height: 18px; color: var(--gold); }
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: rise .2s ease-out; }
  @keyframes rise { from { transform: translate(-50%, 10px); opacity: 0; } }
}

@media (max-width: 900px) {
  .auth, .lesson { grid-template-columns: minmax(0, 1fr); }
  .workbench { position: static; }
  .map-phase { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .continue { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi:nth-child(3) { border-left: 0; }
  .kpi:nth-child(n+3) { border-top: 1px solid var(--line); }
}
@media (max-width: 560px) {
  .stats .pill.hide-sm { display: none; }
  .module { grid-template-columns: 40px minmax(0, 1fr) 16px; }
  .module .prog { grid-column: 2; grid-row: 2; }
  .module .chev { grid-row: 1; grid-column: 3; }
  .map-mod { grid-template-columns: 48px minmax(0,1fr); }
  .map-mod .badge-s { grid-column: 2; justify-self: start; }
  .topbar .wrap { gap: 10px; }
}

/* Spreadsheet trainer (M1.1) and terminal input (M2.3) */
.sheet-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 12px; }
.sheet-tabs button { font: inherit; font-size: .82rem; padding: 4px 10px; border: 1px solid var(--line); border-bottom: 0; border-radius: 8px 8px 0 0; background: var(--surface-2); color: var(--ink-2); }
.sheet-tabs button.cur { background: var(--bg); color: var(--ink); border-color: var(--line-strong); font-weight: 600; }
.sheet-grid { overflow: auto; max-height: 340px; border: 1px solid var(--line-strong); border-radius: 0 8px 8px 8px; }
.sheet-grid table { border-collapse: collapse; font-size: .82rem; font-variant-numeric: tabular-nums; min-width: 100%; }
.sheet-grid th, .sheet-grid td { border: 1px solid var(--line); padding: 4px 8px; white-space: nowrap; text-align: left; }
.sheet-grid thead th, .sheet-grid tbody th { background: var(--surface-2); color: var(--ink-2); font-weight: 500; text-align: center; position: sticky; }
.sheet-grid thead th { top: 0; z-index: 1; }
.sheet-grid tbody th { left: 0; min-width: 32px; }
.sheet-grid td { cursor: pointer; }
.sheet-grid td.num { text-align: right; }
.sheet-grid td:hover { background: var(--accent-soft); }
.sheet-grid tr:first-child td { font-weight: 600; }
.fx { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
.fx b { font-family: var(--font-mono); font-style: italic; color: var(--ink-2); }
.fx input, .term input { font-family: var(--font-mono) !important; }
.fx-result { margin-top: 8px; font-size: .92rem; }
.fx-result code { font-size: .95rem; }
.term { display: flex; align-items: center; gap: 8px; margin-top: 10px; background: var(--code-bg); border-radius: 10px; padding: 4px 12px; }
.term span { font-family: var(--font-mono); color: var(--code-key); }
.term input[type="text"] { background: transparent; border: 0; color: var(--code-ink); padding: 8px 0; }
.term input[type="text"]:focus { outline: none; }

/* Capstone rubric (self-assessment) */
textarea#memo { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--ink); resize: vertical; margin-top: 10px; }
.rubric { display: grid; gap: 10px; margin-top: 12px; }
.rubric fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px 10px; margin: 0; display: grid; gap: 4px; }
.rubric legend { font-weight: 600; padding: 0 4px; }
.rubric label { display: flex; gap: 8px; align-items: baseline; font-size: .9rem; color: var(--ink-2); cursor: pointer; }
.rubric label b { color: var(--ink); min-width: 10px; }
.rubric input:checked + b, .rubric label:has(input:checked) { color: var(--ink); }

</style>
